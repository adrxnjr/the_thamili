<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <!-- Tamil Calligraphy -->
    <text x="12" y="38" font-family="'Mukta Malar', 'Noto Sans Tamil', 'Latha', 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="url(#grad)" letter-spacing="1">தமிழ்</text>
    <!-- Modern Thamili Brand Label -->
    <text x="105" y="35" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#60a5fa" letter-spacing="2">THAMILI</text>
    <text x="105" y="48" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" letter-spacing="1.5">AI STUDIO</text>
  </g>
</svg>
